name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    env:
      TZ: America/Toronto
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Rejouer les cas à blanc
        run: node --test
      - name: Contrôler le plan et générer le site
        run: node build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: publication
        uses: actions/deploy-pages@v5
